name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 scripts/check-project.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/format-java.py --check
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '8'
            profile: nifi1
            nifi: 1.23.2
            bytecode: 52
          - java: '21'
            profile: nifi2
            nifi: 2.12.0
            bytecode: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build independent OPC UA test server
        run: |
          docker build --tag opcua-interop --file tests/interop/Dockerfile tests/interop
          mkdir -p dist/open62541
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/dist/open62541:/output" opcua-interop
      - name: Build and test
        env:
          JAVA_TARGET: ${{ matrix.java }}
          PROFILE: ${{ matrix.profile }}
          NIFI_TARGET: ${{ matrix.nifi }}
        run: |
          set -o pipefail
          mkdir -p dist/ci-logs
          docker run --rm --user "$(id -u):$(id -g)" -e MAVEN_CONFIG=/tmp/maven \
            -e OPCUA_OPEN62541_BINARY=/work/dist/open62541/open62541 \
            -v "$PWD:/work" -w /work "maven:3.9.11-eclipse-temurin-$JAVA_TARGET" \
            mvn -e -B -ntp -Dmaven.repo.local=/tmp/m2/repository "-P$PROFILE" "-Dnifi.version=$NIFI_TARGET" clean verify \
            2>&1 | tee "dist/ci-logs/$PROFILE-build.log"
      - name: Verify NAR and generate inventory
        env:
          NIFI_TARGET: ${{ matrix.nifi }}
          BYTECODE: ${{ matrix.bytecode }}
        run: |
          NAR="nar/target/nifi-opcua-subscriber-$NIFI_TARGET-1.0.2.nar"
          python3 scripts/verify-interop-tests.py processors/target/surefire-reports
          python3 scripts/verify-nar.py "$NAR" "$BYTECODE"
          python3 scripts/nar-inventory.py "$NAR" --output nar/target/dependency-inventory.json
          cd nar/target
          sha256sum -- *.nar dependency-inventory.json > SHA256SUMS
      - name: Check bundled dependency advisories
        run: python3 scripts/check-advisories.py nar/target/dependency-inventory.json --output nar/target/advisory-report.json
      - name: Build demo server
        if: matrix.java == '8'
        run: |
          set -o pipefail
          mkdir -p dist/ci-logs
          docker run --rm --user "$(id -u):$(id -g)" -e MAVEN_CONFIG=/tmp/maven \
            -v "$PWD:/work" -w /work maven:3.9.11-eclipse-temurin-8 \
            mvn -e -B -ntp -Dmaven.repo.local=/tmp/m2/repository -f demo/pom.xml clean package \
            2>&1 | tee dist/ci-logs/demo-build.log
      - name: Upload NAR and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.profile }}-artifacts
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/ci-logs/
            nar/target/*.nar
            nar/target/dependency-inventory.json
            nar/target/SHA256SUMS
            nar/target/advisory-report.json
            processors/target/surefire-reports/
            processors/target/interop-logs/
