name: nifi-opcua-preview # Retained to reuse existing local demo volumes.
services:
  opcua:
    build:
      context: .
      dockerfile: demo/Dockerfile.opcua
    volumes:
      - ./demo/runtime/security:/security
    restart: unless-stopped
  nifi:
    build:
      context: .
      dockerfile: demo/Dockerfile.nifi
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      NIFI_WEB_HTTP_PORT: "8080"
      NIFI_WEB_HTTP_HOST: "0.0.0.0"
      NIFI_JVM_HEAP_INIT: "512m"
      NIFI_JVM_HEAP_MAX: "1g"
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_DEMO_SENSITIVE_KEY:?Set NIFI_DEMO_SENSITIVE_KEY in .env}
    volumes:
      - ./demo/runtime/security:/security
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
    depends_on:
      - opcua
    restart: unless-stopped
volumes:
  nifi-conf:
  nifi-state:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:
networks:
  default:
    ipam:
      config:
        - subnet: ${NIFI_DEMO_SUBNET:-172.30.252.0/24}
